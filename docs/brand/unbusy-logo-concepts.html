<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbusy logo concepts</title>
<!-- Palette: Harbor #10293D (ink, trust) · Clearing #2FBF9F (the un, done, room to grow) · Paper #F4F6F3 (cool off-white) · Haze #7E8E9A (muted) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#10293D; --paper:#F4F6F3; --amber:#2FBF9F; --mute:#7E8E9A; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Manrope, system-ui, sans-serif; background:#DDD; color:var(--ink); }
  .row { display:grid; grid-template-columns:1fr 1fr; }
  .tile { padding:56px 64px; min-height:300px; display:flex; flex-direction:column; justify-content:center; gap:28px; }
  .light { background:var(--paper); color:var(--ink); }
  .dark { background:var(--ink); color:var(--paper); }
  .label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .tag { font-size:16px; font-weight:500; opacity:.75; margin-top:-10px; }
  svg { display:block; }
  .wm { font-family:Manrope, sans-serif; font-weight:800; letter-spacing:-0.04em; }
  .wm2 { font-family:"Bricolage Grotesque", sans-serif; font-weight:800; letter-spacing:-0.035em; }
  .lock { display:flex; align-items:center; gap:22px; }
  @media (max-width: 1100px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- A: The clearing. A dense 3x3 of marks thins to one. Busy becomes unbusy. -->
<div class="row">
  <div class="tile light">
    <div class="label">A · The clearing</div>
    <div class="lock">
      <svg width="96" height="96" viewBox="0 0 96 96" aria-label="Unbusy mark A">
        <g fill="#10293D">
          <rect x="6" y="6" width="22" height="22" rx="6"/>
          <rect x="37" y="6" width="22" height="22" rx="6"/>
          <rect x="6" y="37" width="22" height="22" rx="6"/>
          <rect x="37" y="37" width="22" height="22" rx="6" opacity=".55"/>
          <rect x="6" y="68" width="22" height="22" rx="6" opacity=".3"/>
        </g>
        <rect x="52" y="52" width="38" height="38" rx="11" fill="#2FBF9F"/>
      </svg>
      <svg width="360" height="96" viewBox="0 0 360 96" aria-label="Unbusy wordmark">
        <text class="wm" x="0" y="72" font-size="84" fill="#10293D">un<tspan fill="#10293D" opacity=".55">busy</tspan></text>
      </svg>
    </div>
    <div class="tag">Get the busywork off your team.</div>
  </div>
  <div class="tile dark">
    <div class="label">A · dark</div>
    <div class="lock">
      <svg width="96" height="96" viewBox="0 0 96 96" aria-label="Unbusy mark A dark">
        <g fill="#F4F6F3">
          <rect x="6" y="6" width="22" height="22" rx="6"/>
          <rect x="37" y="6" width="22" height="22" rx="6"/>
          <rect x="6" y="37" width="22" height="22" rx="6"/>
          <rect x="37" y="37" width="22" height="22" rx="6" opacity=".55"/>
          <rect x="6" y="68" width="22" height="22" rx="6" opacity=".3"/>
        </g>
        <rect x="52" y="52" width="38" height="38" rx="11" fill="#2FBF9F"/>
      </svg>
      <svg width="360" height="96" viewBox="0 0 360 96">
        <text class="wm" x="0" y="72" font-size="84" fill="#F4F6F3">un<tspan opacity=".5">busy</tspan></text>
      </svg>
    </div>
    <div class="tag">Get the busywork off your team.</div>
  </div>
</div>

<!-- B: The sticker. "un" is an amber tag slapped over "busy". -->
<div class="row">
  <div class="tile light">
    <div class="label">B · The tag</div>
    <svg width="470" height="120" viewBox="0 0 470 120" aria-label="Unbusy wordmark B">
      <text class="wm2" x="168" y="92" font-size="104" fill="#10293D">busy</text>
      <g transform="rotate(-6 84 60)">
        <rect x="8" y="22" width="152" height="78" rx="18" fill="#2FBF9F"/>
        <text class="wm2" x="30" y="81" font-size="64" fill="#10293D">un</text>
      </g>
    </svg>
    <div class="tag">Get the busywork off your team.</div>
  </div>
  <div class="tile dark">
    <div class="label">B · dark</div>
    <svg width="470" height="120" viewBox="0 0 470 120">
      <text class="wm2" x="168" y="92" font-size="104" fill="#F4F6F3">busy</text>
      <g transform="rotate(-6 84 60)">
        <rect x="8" y="22" width="152" height="78" rx="18" fill="#2FBF9F"/>
        <text class="wm2" x="30" y="81" font-size="64" fill="#10293D">un</text>
      </g>
    </svg>
    <div class="tag">Get the busywork off your team.</div>
  </div>
</div>

<!-- C: The line. A tangle resolves into one straight line; the wordmark sits on the calm end. -->
<div class="row">
  <div class="tile light">
    <div class="label">C · The line</div>
    <svg width="520" height="110" viewBox="0 0 520 110" aria-label="Unbusy mark C">
      <path d="M8 62 C 20 20, 44 20, 50 58 S 84 98, 92 54 S 124 14, 132 56 S 160 92, 170 56 C 180 36, 196 44, 214 54 C 232 62, 252 58, 290 56"
            fill="none" stroke="#10293D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M290 56 H 500" fill="none" stroke="#2FBF9F" stroke-width="9" stroke-linecap="round"/>
    </svg>
    <svg width="360" height="80" viewBox="0 0 360 80">
      <text class="wm" x="0" y="62" font-size="72" fill="#10293D">unbusy</text>
    </svg>
    <div class="tag">Get the busywork off your team.</div>
  </div>
  <div class="tile dark">
    <div class="label">C · dark</div>
    <svg width="520" height="110" viewBox="0 0 520 110">
      <path d="M8 62 C 20 20, 44 20, 50 58 S 84 98, 92 54 S 124 14, 132 56 S 160 92, 170 56 C 180 36, 196 44, 214 54 C 232 62, 252 58, 290 56"
            fill="none" stroke="#F4F6F3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M290 56 H 500" fill="none" stroke="#2FBF9F" stroke-width="9" stroke-linecap="round"/>
    </svg>
    <svg width="360" height="80" viewBox="0 0 360 80">
      <text class="wm" x="0" y="62" font-size="72" fill="#F4F6F3">unbusy</text>
    </svg>
    <div class="tag">Get the busywork off your team.</div>
  </div>
</div>

<!-- App icon / hat check for A -->
<div class="row">
  <div class="tile light" style="flex-direction:row; align-items:center; gap:40px;">
    <div class="label" style="width:120px">A · icon &amp; hat</div>
    <svg width="120" height="120" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="#10293D"/>
      <g fill="#F4F6F3" transform="translate(16 16)">
        <rect x="0" y="0" width="22" height="22" rx="6"/>
        <rect x="31" y="0" width="22" height="22" rx="6"/>
        <rect x="0" y="31" width="22" height="22" rx="6"/>
        <rect x="31" y="31" width="22" height="22" rx="6" opacity=".55"/>
        <rect x="0" y="62" width="22" height="22" rx="6" opacity=".3"/>
      </g>
      <rect x="62" y="62" width="40" height="40" rx="12" fill="#2FBF9F"/>
    </svg>
    <svg width="300" height="70" viewBox="0 0 300 70">
      <text class="wm" x="0" y="54" font-size="60" fill="#10293D" letter-spacing="-0.02em">UNBUSY</text>
    </svg>
  </div>
  <div class="tile dark" style="flex-direction:row; align-items:center; gap:40px;">
    <div class="label" style="width:120px">B · icon &amp; hat</div>
    <svg width="120" height="120" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="28" fill="#F4F6F3"/>
      <g transform="rotate(-7 60 60)">
        <rect x="22" y="36" width="76" height="48" rx="12" fill="#2FBF9F"/>
        <text class="wm2" x="34" y="73" font-size="40" fill="#10293D">un</text>
      </g>
    </svg>
    <svg width="300" height="70" viewBox="0 0 300 70">
      <text class="wm2" x="0" y="54" font-size="60" fill="#F4F6F3">unbusy</text>
    </svg>
  </div>
</div>

</body>
</html>
