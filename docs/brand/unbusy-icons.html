<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unbusy icon options</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#8f8f8f; font-family:Manrope, system-ui, sans-serif; }
  .pal { padding:28px 32px; }
  .pal h2 { margin:0 0 18px; font-size:16px; letter-spacing:.06em; text-transform:uppercase; opacity:.7; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  .card { border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:16px; }
  .name { font-size:14px; font-weight:800; opacity:.8; }
  .sizes { display:flex; align-items:flex-end; gap:18px; }
  svg { display:block; }
  .wm { font-family:Manrope, sans-serif; font-weight:800; letter-spacing:-0.04em; }
</style>
</head>
<body>
<script>
const palettes = [
  { key:'cy', name:'Charcoal + Yellow', ink:'#1E1F22', acc:'#FFD23F', paper:'#FAFAF7' },
  { key:'hc', name:'Harbor + Clearing', ink:'#10293D', acc:'#2FBF9F', paper:'#F4F6F3' },
];
// Each icon is a function (ink, acc, paper, dark) -> svg string on a 100x100 viewBox.
const icons = {
  'A · the "un" tile': (ink,acc,paper,dark) => `
    <rect width="100" height="100" rx="24" fill="${dark?paper:ink}"/>
    <text class="wm" x="50" y="68" text-anchor="middle" font-size="54" fill="${acc}">un</text>`,
  'B · the "u" and the line': (ink,acc,paper,dark) => `
    <rect width="100" height="100" rx="24" fill="${dark?paper:ink}"/>
    <path d="M28 30 V56 a14 14 0 0 0 28 0 V30" fill="none" stroke="${dark?ink:paper}" stroke-width="11" stroke-linecap="round"/>
    <path d="M56 70 H80" fill="none" stroke="${acc}" stroke-width="11" stroke-linecap="round"/>`,
  'C · the tag': (ink,acc,paper,dark) => `
    <rect width="100" height="100" rx="24" fill="${dark?ink:paper}"/>
    <g transform="rotate(-8 50 52)">
      <rect x="16" y="30" width="68" height="44" rx="12" fill="${acc}"/>
      <text class="wm" x="50" y="64" text-anchor="middle" font-size="36" fill="${ink}">un</text>
    </g>`,
  'D · the cleared tray': (ink,acc,paper,dark) => `
    <rect width="100" height="100" rx="24" fill="${dark?paper:ink}"/>
    <path d="M24 34 H76 L84 56 V70 a6 6 0 0 1 -6 6 H22 a6 6 0 0 1 -6 -6 V56 Z" fill="none" stroke="${dark?ink:paper}" stroke-width="8" stroke-linejoin="round"/>
    <path d="M16 56 H36 a14 14 0 0 0 28 0 H84" fill="none" stroke="${dark?ink:paper}" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="50" cy="22" r="9" fill="${acc}"/>`,
};
const svg = (fn, p, size, dark) => `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${fn(p.ink,p.acc,p.paper,dark)}</svg>`;
let html = '';
for (const p of palettes) {
  html += `<div class="pal" style="background:${p.paper};color:${p.ink}"><h2>${p.name} · ${p.ink} / ${p.acc} / ${p.paper}</h2><div class="grid">`;
  for (const [name, fn] of Object.entries(icons)) {
    html += `<div class="card" style="background:${p.paper};outline:1px solid ${p.ink}22">
      <div class="name">${name}</div>
      <div class="sizes">${svg(fn,p,128,false)}${svg(fn,p,64,false)}${svg(fn,p,32,false)}${svg(fn,p,16,false)}</div>
      <div class="sizes" style="background:${p.ink};padding:12px;border-radius:12px">${svg(fn,p,64,true)}${svg(fn,p,32,true)}${svg(fn,p,16,true)}</div>
      <div style="display:flex;align-items:center;gap:10px">${svg(fn,p,40,false)}<svg width="150" height="40" viewBox="0 0 150 40"><text class="wm" x="0" y="31" font-size="36" fill="${p.ink}">un<tspan fill="${p.ink}" opacity=".55">busy</tspan></text></svg></div>
    </div>`;
  }
  html += `</div></div>`;
}
document.body.innerHTML = html;
</script>
</body>
</html>
